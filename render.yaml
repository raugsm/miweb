services:
  - type: web
    name: ariadgsm-ops
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm build
    preDeployCommand: pnpm run postgres:migrate:apply
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARIAD_DATA_DIR
        value: /opt/render/project/src/storage
      # El panel de operadores vive en ops.ariadgsm.com: de aca sale el
      # enlace de recuperar su contrasena. Si apunta a ariadgsm.com, ese
      # enlace cae en la web publica de Ari-Tool y no sirve.
      - key: ARIAD_PUBLIC_URL
        value: https://ops.ariadgsm.com
      - key: ARIAD_MAIL_FROM
        value: '"AriadGSM Soporte" <soporte@ariadgsm.com>'
      - key: ARIAD_SETUP_TOKEN
        generateValue: true
    disk:
      name: ariadgsm-ops-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
